<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Reading Quest — Story Comprehension Adventure</title>
<meta name="description" content="A gamified reading comprehension app with levelled stories, typed answers, and grown-up review.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Reading Quest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="app-root">

      <noscript>Reading Quest needs JavaScript turned on to run. Please enable it in your browser settings.</noscript>
    </div>
  </div>

  <script src="js/illustrations.js"></script>
  <script src="js/stories.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>

</html>
